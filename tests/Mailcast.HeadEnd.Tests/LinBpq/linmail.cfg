  RefuseBulls = 0;
  DontHoldNewUsers = 1;
  DontNeedHomeBBS = 1;
  DontNeedName = 1;
  MaxTXSize = 99999;
  MaxRXSize = 99999;
  Log_BBS = 1;
  Log_TCP = 1;
};
