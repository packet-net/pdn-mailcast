; LinBPQ for the receiver's end-to-end test: node GB7TST with its BBS, and the
; receiver's login on the Telnet port's FBBPORT, set up as README.md tells a sysop to.
SIMPLE=1
NODECALL=GB7TST
NODEALIAS=TST
LOCATOR=IO91WL
LINMAIL
APPLICATION 1,BBS,,GB7TST-1,TSTBBS,255

PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 FBBPORT=8011
 MAXSESSIONS=10
 USER=sysop,sysop,G4TST,,SYSOP
 USER=Q0CAST,mailcast-test,Q0CAST,,
ENDPORT
