; LinBPQ for the shared-radio tests: node GB7TST with a sysop and a plain user on its Telnet
; port, and port 2 as a KISS port to a QtSoundModem that is not there, for XMITOFF to act on.
SIMPLE=1
NODECALL=GB7TST
NODEALIAS=TST
LOCATOR=IO91WL

PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 MAXSESSIONS=10
 USER=sysop,s3cret-sysop,G4TST,,SYSOP
 USER=plain,plain-pw,G4PLN,,
ENDPORT

PORT
 PORTNUM=2
 ID=HF through QtSoundModem
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=127.0.0.1
 TCPPORT=8100
 CHANNEL=A
ENDPORT
