; As bpq32-node.cfg, with a CTEXT on the Telnet port: LinBPQ sends it after the password ending
; in a bare CR, so the answer to PASSWORD shares its line (issue #156).
SIMPLE=1
NODECALL=GB7TST
NODEALIAS=TST
LOCATOR=IO91WL

PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 FBBPORT=8011
 MAXSESSIONS=10
 CTEXT=Welcome to GB7TST's Telnet Server\nPress ? for a list of commands\n
 USER=sysop,s3cret-sysop,G4TST,,SYSOP
 USER=plain,plain-pw,G4PLN,,
ENDPORT

PORT
 PORTNUM=2
 ID=HF through QtSoundModem
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=127.0.0.1
 TCPPORT=8100
 CHANNEL=A
ENDPORT
