// BPQMail for the receiver's end-to-end test. Q0CAST is the receiver's login: a BBS user
// (flags 16) with a forwarding record that allows blocked, compressed, B1 forwarding and
// has no routes, so nothing is ever queued for it, and is not enabled, so LinBPQ never dials it.
// BidLifetime and MaxAge are LinBPQ's usual ones: with BidLifetime 0, every bulletin over a day old is held.
main:
{
  Streams = 10;
  BBSApplNum = 1;
  BBSName = "GB7TST";
  SYSOPCall = "G4TST";
  H-Route = "#42.GBR.EURO";
  EnableUI = 0;
  RefuseBulls = 0;
  DontHoldNewUsers = 1;
  DontNeedHomeBBS = 1;
  DontNeedName = 1;
  MaxTXSize = 99999;
  MaxRXSize = 99999;
  Log_BBS = 1;
  Log_TCP = 1;
};
BBSForwarding:
{
  Q0CAST:
  {
    TOCalls = "";
    ATCalls = "";
    HRoutes = "";
    HRoutesP = "";
    FWDTimes = "";
    ConnectScript = "";
    Enabled = 0;
    RequestReverse = 0;
    AllowBlocked = 1;
    AllowCompressed = 1;
    UseB1Protocol = 1;
    UseB2Protocol = 0;
    SendCTRLZ = 1;
    FWDPersonalsOnly = 0;
    FWDNewImmediately = 0;
    FwdInterval = 3600;
    RevFWDInterval = 0;
    MaxFBBBlock = 10000;
    ConTimeout = 60;
    BBSHA = "";
  };
};
BBSUsers:
{
  Q0CAST = "Mailcast^^^^^^^0^16^0^1^0^0^0^^";
  G4TST = "Sysop^^^^^^^0^8^0^0^0^0^0^^";
};
Housekeeping:
{
  BidLifetime = 60;
  MaxAge = 30;
};
