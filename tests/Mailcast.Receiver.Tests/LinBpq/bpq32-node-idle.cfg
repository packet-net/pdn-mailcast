; LinBPQ for the shared-radio idle test: as bpq32-node.cfg, but node sessions idle out
; after 120 s (IDLETIME) rather than LinBPQ's usual 900 s.
SIMPLE=1
NODECALL=GB7TST
NODEALIAS=TST
LOCATOR=IO91WL
IDLETIME=120

PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 MAXSESSIONS=10
 USER=sysop,s3cret-sysop,G4TST,,SYSOP
 USER=plain,plain-pw,G4PLN,,
ENDPORT

PORT
 PORTNUM=2
 ID=HF through QtSoundModem
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=127.0.0.1
 TCPPORT=8100
 CHANNEL=A
ENDPORT
