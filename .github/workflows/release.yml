name: release

# The release pipeline, after pdn-soundmodem's and pdn-bbs's: test, then build the two Debian
# packages (pdn-mailcast-receiver and pdn-mailcast-headend) for amd64, arm64 and armhf and the
# M0LTE.RaptorQ and Packet.Mailcast NuGet packages, attach them to a GitHub Release, tell packet-net/apt, and hand
# the .nupkg files to nuget.yml for nuget.org.
#
# - A `v*` tag builds and publishes.
# - workflow_dispatch builds everything and leaves it as workflow artifacts, releasing nothing:
#   a full dry run. Set `publish: true` to also cut the GitHub Release and notify apt.
# - A pull request that touches the release machinery runs the same build with publish off, so
#   a change to the packaging proves itself before it merges.
#
# Unlike the siblings this runs on GitHub-hosted runners, as ci.yml does, and builds each
# architecture on a runner of its own where one exists (ubuntu-24.04-arm for arm64). armhf has
# no hosted runner, so it is published from x64; that is fine here because both programs are
# plain self-contained .NET (no NativeAOT, which cannot cross-link, and no trimming), and the
# .NET runtime pack for linux-arm is the same files whatever builds it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.2.0 or 0.2.0-rc1)'
        required: true
      publish:
        description: 'Also cut the GitHub Release and notify the apt repo'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'packaging/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'src/**/*.csproj'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_number }}
        run: |
          case "$EVENT" in
            push) version="${GITHUB_REF#refs/tags/v}" ;;
            workflow_dispatch) version="${INPUT_VERSION#v}" ;;
            # Never published; a version that says where it came from.
            pull_request) version="0.0.0-pr${PR}.${RUN}" ;;
          esac
          if [ -z "$version" ]; then
            echo "::error::no version (tag v* or the version input is required)"
            exit 1
          fi
          # Debian is stricter than SemVer: a version must start with a digit.
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::version '$version' must start with a digit"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # A hyphen means a SemVer prerelease (0.2.0-rc1); mark the release accordingly.
          # apt reads releases/latest, which never shows a prerelease, so one stays off apt.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_PUBLISH" = "true" ]; }; then
            publish=true
          else
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish"

  # The whole suite, the docker LinBPQ tests included (the hosted runner has docker). Nothing is
  # built for release unless this passes.
  test:
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10 (setup-dotnet cannot write to the system
      # install there); DOTNET_ROOT lets the test apphosts find it, as in pdn-soundmodem.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"
      - name: Pull LinBPQ
        timeout-minutes: 5
        run: docker pull m0lte/linbpq@sha256:b01155258c50c0a3f039bc7e3db92e669af505fa95328470980d977d54dd6903
      - name: Build (Release)
        run: dotnet build -c Release
      - name: Test
        # A normal run is a few minutes; a hang must not hold the release for hours.
        timeout-minutes: 20
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  deb:
    needs: [version, test]
    name: deb ${{ matrix.arch }}
    runs-on: ${{ matrix.runner == 'x64' && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-24.04') || matrix.runner }}
    # A stalled mirror once held ci.yml's install step for half an hour; fail it instead.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, arch: amd64, runner: x64, install_test: true }
          - { rid: linux-arm64, arch: arm64, runner: ubuntu-24.04-arm, install_test: true }
          # No hosted armhf runner (and the arm64 hosts cannot run 32-bit code), so this is
          # published from x64 and checked by its contents only.
          - { rid: linux-arm, arch: armhf, runner: x64, install_test: false }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10 (setup-dotnet cannot write to the system
      # install there); DOTNET_ROOT lets the test apphosts find it, as in pdn-soundmodem.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"

      - name: Preflight
        run: |
          command -v dpkg-deb >/dev/null || { echo "::error::dpkg-deb is missing: this job needs a Debian-family runner"; exit 1; }
          command -v readelf >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq binutils; }

      - name: Build the receiver .deb
        run: scripts/build-receiver-deb.sh ${{ matrix.rid }} "$VERSION"

      - name: Build the head end .deb
        run: scripts/build-headend-deb.sh ${{ matrix.rid }} "$VERSION"

      - name: Verify .deb contents
        run: |
          set -euo pipefail
          for pkg in pdn-mailcast-receiver pdn-mailcast-headend; do
            deb="artifacts/${pkg}_${VERSION}_${ARCH}.deb"
            echo "::group::$(basename "$deb")"
            test -f "$deb" || { echo "::error::$deb was not built"; exit 1; }
            dpkg-deb --info "$deb"
            # Capture the listing once and match it in memory: piping dpkg-deb into grep -q
            # gives dpkg-deb a SIGPIPE, which pipefail turns into a failure.
            listing="$(dpkg-deb --contents "$deb")"
            case "$pkg" in
              pdn-mailcast-receiver) lib=usr/lib/pdn-mailcast share=usr/share/pdn-mailcast example=receiver.example.json ;;
              pdn-mailcast-headend)  lib=usr/lib/pdn-mailcast-headend share=usr/share/pdn-mailcast-headend example=headend.example.json ;;
            esac
            grep -q "$lib/$pkg\$" <<<"$listing"
            grep -q "usr/bin/$pkg ->" <<<"$listing"
            grep -q "lib/systemd/system/$pkg\.service\$" <<<"$listing"
            # postinst seeds the config from this path; if it moves, install breaks.
            grep -q "$share/$example\$" <<<"$listing"
            [ "$(dpkg-deb -f "$deb" Package)" = "$pkg" ]
            [ "$(dpkg-deb -f "$deb" Version)" = "$VERSION" ]
            [ "$(dpkg-deb -f "$deb" Architecture)" = "$ARCH" ]
            # The build scripts read the libc6 floor out of the binaries; an unversioned libc6
            # here means that came unstuck.
            dpkg-deb -f "$deb" Depends | grep -qE 'libc6 \(>= [0-9]+\.[0-9]+\)'
            echo "::endgroup::"
          done

      - name: Install both in a clean Debian and run them
        if: matrix.install_test
        timeout-minutes: 10
        run: |
          docker run --rm -e VERSION -v "$PWD/artifacts:/a:ro" debian:bookworm sh -ec '
            apt-get update -qq
            apt-get install -y -qq /a/pdn-mailcast-receiver_*.deb /a/pdn-mailcast-headend_*.deb
            test -f /etc/pdn-mailcast/receiver.json
            test -f /etc/pdn-mailcast-headend/headend.json
            # The receiver reports Major.Minor.Patch alone (it is also the version in its FBB
            # SID), so a prerelease 0.2.0-rc1 shows as 0.2.0; the head end reports it in full.
            for p in pdn-mailcast-receiver pdn-mailcast-headend; do
              out="$($p --version)"
              echo "$out"
              case "$out" in
                "$p $VERSION"|"$p $VERSION+"*|"$p ${VERSION%%-*}") ;;
                *) echo "$p reports \"$out\", expected version $VERSION" >&2; exit 1 ;;
              esac
            done'

      - uses: actions/upload-artifact@v4
        with:
          name: pdn-mailcast-deb-${{ matrix.arch }}
          path: artifacts/pdn-mailcast-*_${{ needs.version.outputs.version }}_${{ matrix.arch }}.deb
          if-no-files-found: error

  nupkg:
    needs: [version, test]
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10 (setup-dotnet cannot write to the system
      # install there); DOTNET_ROOT lets the test apphosts find it, as in pdn-soundmodem.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"
      # The FBB forwarding code is Packet.Fbb, published from packet-net/pdn-fbb; it is a dependency here,
      # not something this repo packs.
      - name: Pack M0LTE.RaptorQ and Packet.Mailcast
        run: |
          set -euo pipefail
          for p in src/Mailcast.RaptorQ/Mailcast.RaptorQ.csproj src/Packet.Mailcast/Packet.Mailcast.csproj; do
            dotnet pack "$p" -c Release -o artifacts -p:Version=${{ needs.version.outputs.version }}
          done
      - name: Check the packages
        run: |
          set -euo pipefail
          for id in M0LTE.RaptorQ Packet.Mailcast; do
            test -f "artifacts/$id.${{ needs.version.outputs.version }}.nupkg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pdn-mailcast-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  release:
    needs: [version, deb, nupkg]
    if: needs.version.outputs.publish == 'true'
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write # to dispatch nuget.yml
    env:
      APT_DISPATCH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes are written from first-parent history between tags

      - uses: actions/download-artifact@v4
        with:
          pattern: pdn-mailcast-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: ./artifacts
        run: |
          set -euo pipefail
          ls -l
          [ "$(find . -maxdepth 1 -name '*.deb' | wc -l)" = 6 ] || { echo "::error::expected six .debs"; exit 1; }
          sha256sum ./*.deb ./*.nupkg | sed 's# \./# #' > SHA256SUMS
          cat SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py "$TAG" > "$RUNNER_TEMP/relnotes.md"
          cat "$RUNNER_TEMP/relnotes.md"
          prerelease=""
          if [ "$PRERELEASE" = "true" ]; then prerelease="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists: replacing its assets and notes"
            gh release upload "$TAG" ./artifacts/*.deb ./artifacts/*.nupkg ./artifacts/SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/relnotes.md"
          else
            gh release create "$TAG" \
              ./artifacts/*.deb ./artifacts/*.nupkg ./artifacts/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "pdn-mailcast $VERSION" \
              --notes-file "$RUNNER_TEMP/relnotes.md" \
              $prerelease
          fi

      - name: Tell the apt repo to rebuild
        # Last, and only after the GitHub Release exists: packet-net/apt indexes whatever is on
        # releases/latest when it runs, so dispatching earlier would re-index the previous one.
        # The same dispatch as pdn-soundmodem and pdn-bbs, but a warning rather than a failure
        # when the token is not visible here: this repo is new, and the org secret has to be
        # granted to it (and the repo added to packet-net/apt's sources.txt) before apt can
        # carry it. Until then apt's daily rebuild would not pick it up either.
        if: env.APT_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          # gh api --input - with a JSON body, not -f client_payload[...]=...: gh's -f does not
          # do curl-style bracket nesting, so the nested object has to arrive as JSON.
          payload=$(printf '{"event_type":"release-published","client_payload":{"repo":"%s","tag":"%s"}}' \
            "$GITHUB_REPOSITORY" "$TAG")
          printf '%s' "$payload" | gh api -X POST repos/packet-net/apt/dispatches --input -

      - name: Warn if APT_DISPATCH_TOKEN missing
        if: env.APT_DISPATCH_TOKEN == ''
        run: echo "::warning::APT_DISPATCH_TOKEN is not visible to this repo, so packet-net/apt was not told about $TAG (the GitHub Release still has the .debs). Grant the org secret to pdn-mailcast and add it to packet-net/apt's sources.txt."

      # The NuGet push lives in nuget.yml, which nuget.org's trusted publishing policy names, and
      # pushes the .nupkg attached to this release. Dispatching it (GITHUB_TOKEN may trigger a
      # workflow_dispatch) keeps the OIDC login out of this job.
      - name: Push the packages to nuget.org
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nuget.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
