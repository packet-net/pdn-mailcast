name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (Release)
        run: dotnet build -c Release
      - name: Test
        # Everything but the docker end-to-end test, which has a job of its own below.
        run: dotnet test -c Release --no-build --filter "Category!=Docker"

  # The receiver end to end: a day's broadcast modulated into a noisy recording, decoded by the
  # receiver and delivered into a real LinBPQ in docker (tests/Mailcast.Receiver.Tests/EndToEndTests.cs).
  receiver-end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pull LinBPQ
        run: docker pull m0lte/linbpq@sha256:b01155258c50c0a3f039bc7e3db92e669af505fa95328470980d977d54dd6903
      - name: End-to-end test
        run: dotnet test tests/Mailcast.Receiver.Tests -c Release --filter "Category=Docker" --logger "console;verbosity=normal"

  # RaptorQ against the independent Rust raptorq crate, both ways. The C# tests already check the
  # committed vectors; this job also checks that the vectors are what the generator makes, and
  # that the crate decodes symbols made by Mailcast.RaptorQ.
  raptorq-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Regenerate the crate's vectors and compare with the committed ones
        run: |
          cargo run --release --locked --manifest-path tools/raptorq-vectors/Cargo.toml -- generate "$RUNNER_TEMP/crate.json"
          diff -q "$RUNNER_TEMP/crate.json" tests/Mailcast.RaptorQ.Tests/Vectors/raptorq-crate-2.0.1.json
      - name: Encode with Mailcast.RaptorQ and decode with the crate
        run: |
          dotnet run -c Release --project tools/RaptorQ.InteropExport -- tests/Mailcast.RaptorQ.Tests/Vectors/raptorq-crate-2.0.1.json "$RUNNER_TEMP/ours.json"
          cargo run --release --locked --manifest-path tools/raptorq-vectors/Cargo.toml -- check "$RUNNER_TEMP/ours.json"
