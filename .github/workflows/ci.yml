name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10 (setup-dotnet cannot write to the system
      # install there); DOTNET_ROOT lets the test apphosts find it, as in pdn-soundmodem.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"
      - name: Build (Release)
        run: dotnet build -c Release
      - name: Test
        # Everything but the docker end-to-end test, which has a job of its own below.
        run: dotnet test -c Release --no-build --filter "Category!=Docker"

  # The receiver end to end: a day's slot modulated into a noisy recording, decoded by the
  # receiver and delivered into a real LinBPQ in docker (tests/Mailcast.Receiver.Tests/EndToEndTests.cs).
  receiver-end-to-end:
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10 (setup-dotnet cannot write to the system
      # install there); DOTNET_ROOT lets the test apphosts find it, as in pdn-soundmodem.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"
      - name: Pull LinBPQ
        run: docker pull m0lte/linbpq@sha256:b01155258c50c0a3f039bc7e3db92e669af505fa95328470980d977d54dd6903
      - name: End-to-end test
        run: dotnet test tests/Mailcast.Receiver.Tests -c Release --filter "Category=Docker" --logger "console;verbosity=normal"

  # RaptorQ against the independent Rust raptorq crate, both ways. The C# tests already check the
  # committed vectors; this job also checks that the vectors are what the generator makes, and
  # that the crate decodes symbols made by Mailcast.RaptorQ.
  raptorq-interop:
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10 (setup-dotnet cannot write to the system
      # install there); DOTNET_ROOT lets the test apphosts find it, as in pdn-soundmodem.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"
      # cargo for the Rust raptorq crate: GitHub's machines have it; on a self-hosted runner without
      # it, install a minimal stable toolchain into the runner account's home (no root needed).
      - name: Rust toolchain
        if: runner.environment != 'github-hosted'
        uses: dtolnay/rust-toolchain@stable
      - name: Regenerate the crate's vectors and compare with the committed ones
        run: |
          cargo run --release --locked --manifest-path tools/raptorq-vectors/Cargo.toml -- generate "$RUNNER_TEMP/crate.json"
          diff -q "$RUNNER_TEMP/crate.json" tests/Mailcast.RaptorQ.Tests/Vectors/raptorq-crate-2.0.1.json
      - name: Encode with Mailcast.RaptorQ and decode with the crate
        run: |
          dotnet run -c Release --project tools/RaptorQ.InteropExport -- tests/Mailcast.RaptorQ.Tests/Vectors/raptorq-crate-2.0.1.json "$RUNNER_TEMP/ours.json"
          cargo run --release --locked --manifest-path tools/raptorq-vectors/Cargo.toml -- check "$RUNNER_TEMP/ours.json"

  # The receiver's .deb for amd64, kept as a build artifact (not published anywhere).
  receiver-deb:
    # The repo's own branches and tags run on packet-net's self-hosted x64 runners; pull requests
    # from forks stay on GitHub's machines, so outside code never runs on ours.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64"]') || 'ubuntu-latest' }}
    # A stalled mirror once held the install step for half an hour; fail it instead.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10 (setup-dotnet cannot write to the system
      # install there); DOTNET_ROOT lets the test apphosts find it, as in pdn-soundmodem.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"
      - name: Build the .deb
        run: scripts/build-receiver-deb.sh linux-x64 0.1.0-ci${{ github.run_number }}
      - name: Install it in a clean Debian and run it
        run: |
          docker run --rm -v "$PWD/artifacts:/a:ro" debian:bookworm sh -ec '
            apt-get update -qq
            apt-get install -y -qq /a/pdn-mailcast-receiver_*_amd64.deb
            test -f /etc/pdn-mailcast/receiver.json
            pdn-mailcast-receiver --version'
      - uses: actions/upload-artifact@v4
        with:
          name: pdn-mailcast-receiver-deb
          path: artifacts/pdn-mailcast-receiver_*.deb
