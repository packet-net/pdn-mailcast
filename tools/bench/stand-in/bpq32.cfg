; The bench's LinBPQ: a node with a Telnet port the receiver (or a hook) logs in to as sysop,
; and port 2 on a KISS TNC, which here is tools/bench/kiss-tnc.py over TCP. It sends its ID
; every minute so there is always something for it to transmit.
SIMPLE=1
NODECALL=G0ABC-1
NODEALIAS=BENCH
LOCATOR=IO91WL
IDINTERVAL=1
IDMSG:
G0ABC-1 bench node
***
PORT
 ID=Telnet
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 FBBPORT=8011
 MAXSESSIONS=10
 USER=sysop,change-me,G0ABC,,SYSOP
ENDPORT
PORT
 PORTNUM=2
 ID=HF on the KISS TNC
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=127.0.0.1
 TCPPORT=8100
 CHANNEL=A
ENDPORT
